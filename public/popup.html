<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Arial, sans-serif;
        width: 290px;
        padding: 18px;
        background: #111;
        color: #eee;
        text-align: center;
      }
      h2 { color: #ff4d4d; margin-bottom: 4px; }
      p { font-size: 12px; color: #aaa; }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 10px;
        background: #ff4d4d;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
      }
      button:hover { background: #cc0000; }
      .note { margin-top: 10px; font-size: 11px; color: #555; }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 16px;
        font-size: 13px;
      }
      .switch { position: relative; width: 42px; height: 22px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute;
        inset: 0;
        background: #333;
        border-radius: 22px;
        transition: background 0.2s;
        cursor: pointer;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background: #888;
        border-radius: 50%;
        transition: transform 0.2s, background 0.2s;
      }
      .switch input:checked + .slider { background: #ff4d4d; }
      .switch input:checked + .slider::before { transform: translateX(20px); background: #fff; }
      input[type="range"] {
        width: 120px;
        accent-color: #ff4d4d;
      }
      .stats {
        margin-top: 16px;
        padding: 10px;
        background: #1b1b1b;
        border-radius: 8px;
        font-size: 12px;
        color: #bbb;
      }
      .stats b { color: #ff4d4d; }
      .reset {
        margin-top: 8px;
        padding: 4px 10px;
        width: auto;
        font-size: 11px;
        background: #222;
        color: #777;
        border: 1px solid #333;
      }
      .reset:hover { background: #2a2a2a; color: #aaa; }
    </style>
  </head>
  <body>
    <h2>Rejection Alert</h2>
    <p>Watching your Gmail for the inevitable.<br />It will sound just as bad as it feels.</p>

    <div class="row">
      <span>Armed</span>
      <label class="switch">
        <input type="checkbox" id="enabled" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <span>Volume</span>
      <input type="range" id="volume" min="0" max="100" value="100" />
      <span id="volumeValue">100%</span>
    </div>

    <div class="stats">
      💀 <b id="rejectionCount">0</b> rejections witnessed<span id="lastRejection"></span>
      <br />
      <button class="reset" id="resetBtn">reset counter</button>
    </div>

    <button id="testBtn">Test The Sound of Failure</button>
    <p class="note">Active on Gmail tabs only</p>

    <script src="popup.js"></script>
  </body>
</html>
