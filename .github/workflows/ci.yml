name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Chrome)
        run: npm run package

      - name: Build (Firefox)
        run: npm run package:firefox

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: rejection-alert-chrome
          path: dist/rejection-alert.zip
          if-no-files-found: error

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: rejection-alert-firefox
          path: dist-firefox/rejection-alert.zip
          if-no-files-found: error
